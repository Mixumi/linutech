<!doctype html>
<html lang="zh-Hans" id="top">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>隐私政策 | Linutech</title>
  <meta name="description" content="查看 TimeHabit、ReadyGo 及其他 Linutech 产品各自的隐私政策。">
  <link rel="canonical" href="https://mixumi.github.io/linutech/privacy.html">
  <style>
    :root {
      color-scheme: light;
      font: 100%/1.65 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #202124;
      background: #f9f8f6;
      --line: #d8d6d0;
      --muted: #56534d;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: .25rem; }
    .shell { width: min(69rem, calc(100% - clamp(2rem, 7vw, 6rem))); margin-inline: auto; }
    .skip-link { position: absolute; z-index: 1; top: .5rem; left: .75rem; padding: .5rem .75rem; background: #fff; transform: translateY(-150%); }
    .skip-link:focus { transform: translateY(0); }
    .site-header, .site-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1.25rem; }
    .site-header { border-bottom: 1px solid var(--line); padding-block: 1.25rem; }
    .brand { font-size: 1.2rem; font-weight: 760; letter-spacing: -.035em; text-decoration: none; }
    main { display: grid; grid-template-columns: minmax(13rem, .85fr) minmax(0, 1.4fr); align-items: start; gap: 1.75rem clamp(2rem, 7vw, 6rem); padding-block: clamp(2.5rem, 11vh, 7rem); }
    h1 { margin: 0; font-size: clamp(2.4rem, 6vw, 4.25rem); line-height: 1.2; font-weight: 750; letter-spacing: -.055em; }
    .heading-en { margin: .55rem 0 0; color: var(--muted); font-size: 1.0625rem; }
    .policy-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    .policy-list li { border-bottom: 1px solid var(--line); }
    .policy-link { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3.75rem; padding: .85rem .75rem; font-size: 1.125rem; font-weight: 620; line-height: 1.45; text-decoration: none; scroll-margin-top: 1rem; }
    .policy-link:hover, .policy-link:target { background: #fff; }
    .policy-link:hover .product-name, .policy-link:focus-visible .product-name { text-decoration: underline; }
    .arrow { flex: none; color: var(--muted); font-weight: 400; }
    .site-footer { border-top: 1px solid var(--line); padding-block: 1.25rem 2rem; color: var(--muted); font-size: .9375rem; }
    @media (max-width: 43rem) {
      main { grid-template-columns: 1fr; padding-block: 2.5rem 3rem; }
      .policy-link { padding-inline: .3rem; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#directory">跳至产品列表</a>
  <header class="shell site-header">
    <a class="brand" href="index.html">Linutech</a>
  </header>
  <main class="shell" id="directory">
    <header>
      <h1 id="directory-title">隐私政策</h1>
      <p class="heading-en" lang="en">Privacy policies</p>
    </header>
    <nav id="other-products" aria-labelledby="directory-title">
      <ul class="policy-list">
        <li><a class="policy-link" id="timehabit" href="timehabit-privacy.html"><span class="product-name">TimeHabit</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a class="policy-link" id="readygo" href="readygo-privacy.html"><span class="product-name">ReadyGo</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a class="policy-link" id="goalhabit" href="goalhabit-privacy.html"><span class="product-name">GoalHabit</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a class="policy-link" id="timinghabit" href="timinghabit-privacy.html"><span class="product-name">TimingHabit</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a class="policy-link" id="taskmatrix" href="taskmatrix-privacy.html"><span class="product-name">TaskMatrix</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a class="policy-link" id="limstar" href="limstar-privacy.html"><span class="product-name">LimStar · 星喵专注</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a class="policy-link" id="tastepost" href="tastepost-privacy.html"><span class="product-name">TastePost</span><span class="arrow" aria-hidden="true">→</span></a></li>
      </ul>
    </nav>
  </main>
  <footer class="shell site-footer">
    <span>© 2026 Linutech</span>
    <a href="mailto:linutech@163.com">联系 Linutech</a>
  </footer>
  <script>
    (() => {
      const productLinks = new Map(Array.from(document.querySelectorAll('.policy-link'), link => [link.id, link]));
      const readyGoLocales = ['zh-Hans', 'zh-Hant', 'en', 'ja', 'ko', 'fr', 'ru'];
      const readyGoTopics = ['data', 'icloud', 'permissions', 'display', 'purchases', 'sharing', 'control', 'security', 'website', 'contact'];

      function forwardLegacyAddress() {
        const current = new URL(location.href);
        let anchor;
        try {
          anchor = decodeURIComponent(current.hash.slice(1));
        } catch {
          return;
        }
        const readyGoDetail = readyGoLocales.some(locale =>
          anchor === 'policy-' + locale ||
          readyGoTopics.some(topic => anchor === locale + '-' + topic)
        );
        const product = readyGoDetail ? 'readygo' : anchor;
        const link = productLinks.get(product);
        if (!link) return;

        const target = new URL(link.href);
        target.search = current.search;
        if (product !== 'timehabit') target.hash = anchor;
        location.replace(target.href);
      }

      forwardLegacyAddress();
      window.addEventListener('hashchange', forwardLegacyAddress);

      const language = new URL(location.href).searchParams.get('lang');
      if (language) {
        for (const product of ['timehabit', 'readygo']) {
          const link = productLinks.get(product);
          const target = new URL(link.href);
          target.searchParams.set('lang', language);
          link.href = target.href;
        }
      }
    })();
  </script>
</body>
</html>
