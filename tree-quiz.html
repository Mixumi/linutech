:root {
  color-scheme: light;
  --bg: #f4f7ef;
  --surface: #ffffff;
  --surface-soft: #eef4ea;
  --ink: #17251d;
  --muted: #647366;
  --line: #dbe5d7;
  --green: #2f6b4f;
  --green-deep: #204935;
  --mint: #dceee3;
  --red: #b94d3a;
  --red-soft: #f7ded8;
  --amber: #e8a93d;
  --blue: #385f7f;
  --shadow: 0 18px 60px rgba(31, 55, 42, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
}

button {
  font: inherit;
}

[hidden] {
  display: none !important;
}

.app-shell {
  width: min(1120px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: minmax(0, 1fr) 220px;
  gap: 16px;
  align-items: start;
  align-content: start;
}

.quiz-panel,
.stats-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.quiz-panel {
  min-height: calc(100vh - 36px);
  display: grid;
  grid-template-rows: auto 1fr auto;
}

.topbar {
  padding: 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 14px;
  align-items: center;
  justify-content: space-between;
}

.brand {
  min-width: 0;
  display: flex;
  gap: 12px;
  align-items: center;
}

.brand-mark {
  flex: 0 0 auto;
  border-radius: 8px;
  background: var(--surface-soft);
}

h1,
h2,
p {
  margin: 0;
}

h1 {
  font-size: 20px;
  line-height: 1.2;
  letter-spacing: 0;
}

#status-line {
  margin-top: 4px;
  color: var(--muted);
  font-size: 14px;
}

.mode-switch {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  padding: 3px;
  border-radius: 8px;
  background: var(--surface-soft);
  border: 1px solid var(--line);
}

.mode-button {
  min-width: 58px;
  min-height: 36px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
}

.mode-button.is-active {
  background: var(--green);
  color: #fff;
}

.question-stage {
  padding: 26px;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 18px;
}

.question-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.question-meta span {
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
  border-radius: 8px;
  background: var(--surface-soft);
  color: var(--green-deep);
  font-size: 14px;
  font-weight: 650;
}

#question-text {
  max-width: 920px;
  font-size: clamp(22px, 2.6vw, 34px);
  line-height: 1.45;
  letter-spacing: 0;
}

.options {
  display: grid;
  gap: 12px;
  align-content: start;
}

.option-button {
  width: 100%;
  min-height: 62px;
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 12px;
  align-items: center;
  text-align: left;
}

.option-button:disabled {
  opacity: 1;
}

.option-button:not(:disabled):active {
  transform: translateY(1px);
}

.option-key {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--surface-soft);
  color: var(--green-deep);
  font-weight: 800;
}

.option-text {
  min-width: 0;
  font-size: 18px;
  line-height: 1.45;
}

.option-button.is-correct {
  border-color: rgba(47, 107, 79, 0.5);
  background: var(--mint);
}

.option-button.is-correct .option-key {
  background: var(--green);
  color: #fff;
}

.option-button.is-wrong {
  border-color: rgba(185, 77, 58, 0.48);
  background: var(--red-soft);
}

.option-button.is-wrong .option-key {
  background: var(--red);
  color: #fff;
}

.result {
  padding: 14px 16px;
  border-radius: 8px;
  border: 1px solid var(--line);
  display: grid;
  gap: 6px;
}

.result.is-correct {
  background: var(--mint);
  border-color: rgba(47, 107, 79, 0.35);
}

.result.is-wrong {
  background: var(--red-soft);
  border-color: rgba(185, 77, 58, 0.35);
}

.result-title {
  font-weight: 800;
}

.result-answer {
  color: var(--ink);
  line-height: 1.45;
}

.action-bar {
  padding: 16px 18px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
  align-items: center;
}

.primary-action,
.secondary-action,
.icon-action {
  min-height: 46px;
  border-radius: 8px;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.primary-action {
  flex: 1 1 auto;
  gap: 10px;
  padding: 0 18px;
  background: var(--green);
  color: #fff;
  font-weight: 760;
}

.secondary-action {
  flex: 0 0 auto;
  gap: 8px;
  padding: 0 14px;
  background: var(--surface-soft);
  color: var(--green-deep);
  border-color: var(--line);
  font-weight: 720;
}

.reset-icon {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: #fff;
  font-size: 18px;
  line-height: 1;
}

.button-icon {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.16);
  font-size: 28px;
  line-height: 1;
}

.icon-action {
  width: 48px;
  background: var(--surface-soft);
  color: var(--green-deep);
  border-color: var(--line);
  font-size: 22px;
}

.stats-panel {
  padding: 14px;
  display: grid;
  gap: 10px;
  position: sticky;
  top: 18px;
}

.stat-block {
  min-height: 74px;
  padding: 12px;
  border-radius: 8px;
  background: var(--surface-soft);
  display: grid;
  align-content: center;
  gap: 4px;
}

.stat-label {
  color: var(--muted);
  font-size: 13px;
}

.stat-block strong {
  color: var(--blue);
  font-size: 28px;
  line-height: 1;
}

.is-empty {
  color: var(--muted);
}

@media (max-width: 840px) {
  .app-shell {
    grid-template-columns: 1fr;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  }

  .quiz-panel {
    min-height: auto;
  }

  .stats-panel {
    position: static;
    grid-template-columns: repeat(4, 1fr);
    order: -1;
  }

  .stat-block {
    min-height: 64px;
  }
}

@media (max-width: 620px) {
  .topbar {
    align-items: stretch;
    flex-direction: column;
  }

  .mode-switch {
    width: 100%;
  }

  .question-stage {
    padding: 20px 16px;
  }

  #question-text {
    font-size: 22px;
  }

  .option-button {
    min-height: 58px;
    grid-template-columns: 34px 1fr;
  }

  .option-key {
    width: 34px;
    height: 34px;
  }

  .option-text {
    font-size: 16px;
  }

  .stats-panel {
    grid-template-columns: repeat(2, 1fr);
  }
}

swerText":"叶轴具宽翅（叶翼），是小叶间叶轴扁平呈翅状"},{"id":216,"rawId":216,"sourcePage":50,"prompt":"盐肤木的经济用途很多，其主要的经济用途是（）。","options":[{"key":"A","text":"果实味甜多汁，是南方主要鲜食野果之一"},{"key":"B","text":"叶上寄生五倍子蚜虫形成的虫瘿——“五倍子”，是重要工业原料（单宁酸）"},{"key":"C","text":"叶片可加工成高档茶叶，市场价值极高"},{"key":"D","text":"木材坚硬致密，是制作高档红木家具的首选材料"}],"answer":"B","answerText":"叶上寄生五倍子蚜虫形成的虫瘿——“五倍子”，是重要工业原料（单宁酸）"},{"id":217,"rawId":217,"sourcePage":50,"prompt":"下列关于南酸枣的经济用途说法正确的是（）。","options":[{"key":"A","text":"果实味甜多汁，是南方主要鲜食水果之一"},{"key":"B","text":"果肉可加工成果糕、果酒等食品，果核可制活性炭，木材可作家具"},{"key":"C","text":"叶片可加工成高档茶叶，市场价值极高"},{"key":"D","text":"木材疏松软烂，不能作为用材林树种"}],"answer":"B","answerText":"果肉可加工成果糕、果酒等食品，果核可制活性炭，木材可作家具"},{"id":218,"rawId":218,"sourcePage":50,"prompt":"南酸枣的特殊形态特征表现在（）。","options":[{"key":"A","text":"枝条常具细长枝刺，树皮呈亮红色"},{"key":"B","text":"果核顶端有 5 个小孔（萌发孔），种子由此萌发，故称“五眼果”"},{"key":"C","text":"叶片两面均密被灰白色绒毛，呈银灰色"},{"key":"D","text":"树干呈方形或五边形，具有明显纵棱"}],"answer":"B","answerText":"果核顶端有 5 个小孔（萌发孔），种子由此萌发，故称“五眼果”"},{"id":219,"rawId":219,"sourcePage":51,"prompt":"南酸枣的主要生态文化价值描述错误的是（）。","options":[{"key":"A","text":"果核顶端有 5 个孔，自古以来象征“五福临门”，被用作佛珠或饰品"},{"key":"B","text":"考古发现河姆渡遗址中存有大量南酸枣核，证明 7000 年前先民已采食南酸枣"},{"key":"C","text":"树干端直、冠大荫浓，是优良的庭荫树及行道树种"},{"key":"D","text":"果实酸涩有毒，不能为野生动物提供食物，也无生态价值"}],"answer":"D","answerText":"果实酸涩有毒，不能为野生动物提供食物，也无生态价值"},{"id":220,"rawId":220,"sourcePage":51,"prompt":"紫薇又名痒痒树、光皮树，其主要的识别要点是（）。","options":[{"key":"A","text":"叶片为单叶对生，边缘有细锐锯齿"},{"key":"B","text":"花大型，花瓣皱缩，边缘呈流苏状，花色有紫、红、粉、白等"},{"key":"C","text":"花序为伞形花序，花单生于枝顶"},{"key":"D","text":"果实为红色浆果，成熟后多汁可食"}],"answer":"B","answerText":"花大型，花瓣皱缩，边缘呈流苏状，花色有紫、红、粉、白等"},{"id":221,"rawId":221,"sourcePage":51,"prompt":"关于紫薇的经济用途，下列说法正确的是（）。","options":[{"key":"A","text":"果实味甜多汁，是我国南方主要鲜食野果之一"},{"key":"B","text":"木材坚硬致密，是制作高档红木家具的首选材料"},{"key":"C","text":"根、树皮、叶及花均可入药，也是重要的园林绿化树种之一"},{"key":"D","text":"叶片可加工成高档茶叶，市场价值极高"}],"answer":"C","answerText":"根、树皮、叶及花均可入药，也是重要的园林绿化树种之一"},{"id":222,"rawId":222,"sourcePage":51,"prompt":"下列关于紫薇的特殊形态特征说法正确的是（）。","options":[{"key":"A","text":"枝条常具细长枝刺，树皮呈亮红色"},{"key":"B","text":"用手轻抚树干，全树会微微颤动，故有“痒痒树”之称"},{"key":"C","text":"叶片两面均密被灰白色绒毛，呈银灰色"},{"key":"D","text":"花萼筒状，表面光滑无毛，花药呈黑色"}],"answer":"B","answerText":"用手轻抚树干，全树会微微颤动，故有“痒痒树”之称"},{"id":223,"rawId":223,"sourcePage":52,"prompt":"桂花又名木犀，根据其花色和开花时间，一般可分为金桂、银桂、丹桂和四季桂，其中金桂的主要经济用途是（）。","options":[{"key":"A","text":"果实味甜多汁，是我国南方主要鲜食野果之一"},{"key":"B","text":"花可食用，常用于制作桂花糕、桂花茶、桂花酒等食品"},{"key":"C","text":"叶片可加工成高档香料，国际市场价值极高"},{"key":"D","text":"木材坚硬致密，是制作高档红木家具的首选材料"}],"answer":"B","answerText":"花可食用，常用于制作桂花糕、桂花茶、桂花酒等食品"},{"id":224,"rawId":224,"sourcePage":52,"prompt":"合肥市的市花是（）。","options":[{"key":"A","text":"桂花、石榴"},{"key":"B","text":"桂花、玉兰"},{"key":"C","text":"石榴、枇杷"},{"key":"D","text":"兰花、荷花"}],"answer":"A","answerText":"桂花、石榴"},{"id":225,"rawId":225,"sourcePage":52,"prompt":"金桂开黄颜色的花，香味浓郁、色泽鲜艳，其主要的生态文化价值描述错误的是（）。","options":[{"key":"A","text":"桂与“贵”谐音，象征富贵吉祥，常与玉兰、海棠等配植取“玉堂富贵”之意"},{"key":"B","text":"在中国传统文化中，“折桂”寓意登科及第、科举高中"},{"key":"C","text":"因花色金黄如粟，在古代被视为富贵之色，深受帝王喜爱"},{"key":"D","text":"金桂树皮光滑，易被游客刻画伤害，故不宜种植于人流密集的公园"}],"answer":"D","answerText":"金桂树皮光滑，易被游客刻画伤害，故不宜种植于人流密集的公园"},{"id":226,"rawId":226,"sourcePage":52,"prompt":"关于金桂的识别要点，下列说法正确的是（）。","options":[{"key":"A","text":"叶片为单叶对生，边缘全缘无锯齿"},{"key":"B","text":"花簇生于叶腋间，花冠合瓣四裂，金黄色，极芳香"},{"key":"C","text":"果实为红色浆果，成熟后多汁可食"},{"key":"D","text":"树皮光滑呈亮白色，呈纸状剥落"}],"answer":"B","answerText":"花簇生于叶腋间，花冠合瓣四裂，金黄色，极芳香"},{"id":227,"rawId":227,"sourcePage":53,"prompt":"银桂开乳白的花，其主要的野外识别要点是（）。","options":[{"key":"A","text":"叶片椭圆形或长椭圆形，较金桂叶片更宽大"},{"key":"B","text":"叶缘全缘或先端有疏锯齿，较金桂锯齿更明显"},{"key":"C","text":"花序为圆锥花序，大型顶生，花多单生"},{"key":"D","text":"与金桂相比，银桂花色为黄白色，金桂为金黄色"}],"answer":"D","answerText":"与金桂相比，银桂花色为黄白色，金桂为金黄色"},{"id":228,"rawId":228,"sourcePage":53,"prompt":"桂花为我国十大传统花卉之一，其生物学特性描述正确的是（）。","options":[{"key":"A","text":"属于落叶灌木，冬季叶片全部脱落"},{"key":"B","text":"只能生长于热带地区，不耐寒"},{"key":"C","text":"为常绿阔叶小乔木或灌木，喜光，较耐阴，喜温暖湿润气候"},{"key":"D","text":"花期为春季 3-4 月，果期为夏季"}],"answer":"C","answerText":"为常绿阔叶小乔木或灌木，喜光，较耐阴，喜温暖湿润气候"},{"id":229,"rawId":229,"sourcePage":53,"prompt":"丹桂开橘黄色的花，关于丹桂的识别要点，下列说法正确的是（）。","options":[{"key":"A","text":"叶片为单叶互生，边缘全缘无锯齿"},{"key":"B","text":"花簇生于叶腋间，花冠合瓣四裂，橙红色或橙黄色，香气较淡"},{"key":"C","text":"果实为红色浆果，成熟后多汁可食"},{"key":"D","text":"树皮光滑呈亮白色，呈纸状剥落"}],"answer":"B","answerText":"花簇生于叶腋间，花冠合瓣四裂，橙红色或橙黄色，香气较淡"},{"id":230,"rawId":230,"sourcePage":53,"prompt":"关于丹桂的生态文化价值，下列说法不合适的是（）。","options":[{"key":"A","text":"丹桂花色红艳，象征喜庆、吉祥，常用于节日庆典及婚庆园林造景"},{"key":"B","text":"桂花与“贵”谐音，丹桂因色红，在传统文化中兼有“富贵”与“红火”之意"},{"key":"C","text":"在中国传统文化中，“丹桂”一词也指科举及第，如“蟾宫折桂”中的桂即为丹桂"},{"key":"D","text":"因丹桂树皮光滑易被刻画，且花色过艳被认为不雅，故不宜种植于庭院"}],"answer":"D","answerText":"因丹桂树皮光滑易被刻画，且花色过艳被认为不雅，故不宜种植于庭院"},{"id":231,"rawId":231,"sourcePage":54,"prompt":"下列关于四季桂的生态文化价值说法错误的是（）。","options":[{"key":"A","text":"因一年多次开花，象征“四季常青、吉祥如意”，深受群众喜爱"},{"key":"B","text":"在中国传统文化中，桂花与“贵”谐音，四季桂寓意“四季富贵”"},{"key":"C","text":"因花期长、适应性强，是城市绿化和庭院美化的理想树种"},{"key":"D","text":"四季桂花香浓郁堪比金桂，因此被作为提取桂花精油的首选品种"}],"answer":"D","answerText":"四季桂花香浓郁堪比金桂，因此被作为提取桂花精油的首选品种"},{"id":232,"rawId":232,"sourcePage":54,"prompt":"桂花品种不同，其形态特征不同，下列说法正确的是（）。","options":[{"key":"A","text":"金桂花色为黄白色，银桂花色为金黄色"},{"key":"B","text":"丹桂花色为橙红色或橙黄色，是桂花中花色最深的品种"},{"key":"C","text":"四季桂一年只开一次花，花期在秋季"},{"key":"D","text":"所有桂花品种的叶片均为单叶互生，边缘全缘无锯齿"}],"answer":"B","answerText":"丹桂花色为橙红色或橙黄色，是桂花中花色最深的品种"},{"id":233,"rawId":233,"sourcePage":54,"prompt":"女贞俗称冬青，为主要的乡土树种，在药用方面其主要的经济用途是 （）。","options":[{"key":"A","text":"果实味甜多汁，是我国南方主要鲜食野果之一"},{"key":"B","text":"果实（女贞子）为中药，具有滋补肝肾、乌须明目的功效"},{"key":"C","text":"叶片可加工成高档茶叶，市场价值极高"},{"key":"D","text":"木材坚硬致密，是制作高档红木家具的首选材料"}],"answer":"B","answerText":"果实（女贞子）为中药，具有滋补肝肾、乌须明目的功效"},{"id":234,"rawId":234,"sourcePage":54,"prompt":"女贞的用途非常广泛，在生态文化建设中，下列生态文化价值说法错误的是（）。","options":[{"key":"A","text":"因四季常青，常植于庭院、墓地，象征“坚贞不渝”"},{"key":"B","text":"女贞对二氧化硫、氯气等有害气体有较强抗性，是优良的城市绿化树种"},{"key":"C","text":"在中国传统文化中，女贞因其冬青不凋，被赋予“贞洁”“守节”的寓意"},{"key":"D","text":"女贞果实有毒，生态价值低"}],"answer":"D","answerText":"女贞果     <script>
const elements = {
  statusLine: document.querySelector("#status-line"),
  questionId: document.querySelector("#question-id"),
  pageInfo: document.querySelector("#page-info"),
  questionText: document.querySelector("#question-text"),
  options: document.querySelector("#options"),
  result: document.querySelector("#result"),
  nextButton: document.querySelector("#next-button"),
  reshuffleButton: document.querySelector("#reshuffle-button"),
  resetButton: document.querySelector("#reset-button"),
  totalCount: document.querySelector("#total-count"),
  answeredCount: document.querySelector("#answered-count"),
  accuracy: document.querySelector("#accuracy"),
  wrongCount: document.querySelector("#wrong-count"),
  modeButtons: Array.from(document.querySelectorAll(".mode-button")),
};

const STORAGE_KEY = "tree-quiz-state-v1";

const app = {
  questions: [],
  deck: [],
  current: null,
  selectedKey: "",
  mode: "all",
  stats: {
    answered: 0,
    correct: 0,
    wrongIds: [],
  },
};

function readStoredValue() {
  try {
    return localStorage.getItem(STORAGE_KEY);
  } catch {
    return null;
  }
}

function writeStoredValue(value) {
  try {
    localStorage.setItem(STORAGE_KEY, value);
  } catch {
    // Some file preview environments disable localStorage.
  }
}

function removeStoredValue() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch {
    // Some file preview environments disable localStorage.
  }
}

function createEmptyStats() {
  return {
    answered: 0,
    correct: 0,
    wrongIds: [],
  };
}

function loadStoredStats() {
  try {
    const value = JSON.parse(readStoredValue() || "null");
    if (!value) return;
    app.stats.answered = Number(value.answered) || 0;
    app.stats.correct = Number(value.correct) || 0;
    app.stats.wrongIds = Array.isArray(value.wrongIds) ? value.wrongIds.map(Number) : [];
  } catch {
    removeStoredValue();
  }
}

function saveStoredStats() {
  writeStoredValue(JSON.stringify(app.stats));
}

async function loadQuestions() {
  const embeddedData = window.EMBEDDED_QUIZ_DATA;
  if (embeddedData && Array.isArray(embeddedData.questions)) {
    return embeddedData.questions;
  }
  return [];
}

function setChildren(parent, children) {
  while (parent.firstChild) {
    parent.removeChild(parent.firstChild);
  }
  children.forEach((child) => parent.appendChild(child));
}

function shuffle(items) {
  const next = [...items];
  for (let index = next.length - 1; index > 0; index -= 1) {
    const swapIndex = Math.floor(Math.random() * (index + 1));
    [next[index], next[swapIndex]] = [next[swapIndex], next[index]];
  }
  return next;
}

function getPool() {
  if (app.mode === "wrong") {
    const wrongSet = new Set(app.stats.wrongIds);
    return app.questions.filter((question) => wrongSet.has(question.id));
  }
  return app.questions;
}

function resetDeck() {
  app.deck = shuffle(getPool());
}

function nextQuestion() {
  const pool = getPool();
  app.selectedKey = "";
  hideResult();

  if (!pool.length) {
    app.current = null;
    renderEmptyState();
    return;
  }

  if (!app.deck.length) resetDeck();
  app.current = app.deck.pop();
  renderQuestion();
}

function renderEmptyState() {
  elements.questionId.textContent = app.mode === "wrong" ? "错题已清空" : "-";
  elements.pageInfo.textContent = "-";
  elements.questionText.textContent = app.mode === "wrong" ? "当前没有错题。" : "题库为空。";
  elements.questionText.classList.add("is-empty");
  setChildren(elements.options, []);
  elements.nextButton.disabled = app.mode === "wrong";
}

function renderQuestion() {
  const question = app.current;
  elements.questionText.classList.remove("is-empty");
  elements.nextButton.disabled = false;
  elements.questionId.textContent = `第 ${question.id} 题`;
  elements.pageInfo.textContent = `PDF 第 ${question.sourcePage} 页`;
  elements.questionText.textContent = question.prompt;
  setChildren(elements.options, question.options.map((option) => renderOption(option)));
}

function renderOption(option) {
  const button = document.createElement("button");
  button.className = "option-button";
  button.type = "button";
  button.dataset.key = option.key;
  button.addEventListener("click", () => selectOption(option.key));

  const key = document.createElement("span");
  key.className = "option-key";
  key.textContent = option.key;

  const text = document.createElement("span");
  text.className = "option-text";
  text.textContent = option.text;

  button.append(key, text);
  return button;
}

function selectOption(key) {
  if (!app.current || app.selectedKey) return;

  app.selectedKey = key;
  const isCorrect = key === app.current.answer;
  app.stats.answered += 1;
  if (isCorrect) {
    app.stats.correct += 1;
    app.stats.wrongIds = app.stats.wrongIds.filter((id) => id !== app.current.id);
  } else if (!app.stats.wrongIds.includes(app.current.id)) {
    app.stats.wrongIds.push(app.current.id);
  }

  saveStoredStats();
  markOptions();
  showResult(isCorrect);
  updateStats();
}

function markOptions() {
  Array.from(elements.options.children).forEach((button) => {
    const key = button.dataset.key;
    button.disabled = true;
    if (key === app.current.answer) button.classList.add("is-correct");
    if (key === app.selectedKey && key !== app.current.answer) button.classList.add("is-wrong");
  });
}

function hideResult() {
  elements.result.hidden = true;
  elements.result.className = "result";
  setChildren(elements.result, []);
}

function showResult(isCorrect) {
  elements.result.hidden = false;
  elements.result.classList.add(isCorrect ? "is-correct" : "is-wrong");

  const title = document.createElement("div");
  title.className = "result-title";
  title.textContent = isCorrect ? "答对了" : "答错了";

  const answer = document.createElement("div");
  answer.className = "result-answer";
  answer.textContent = `正确答案：${app.current.answer}. ${app.current.answerText}`;

  setChildren(elements.result, [title, answer]);
}

function updateStats() {
  const total = app.questions.length;
  const answered = app.stats.answered;
  const accuracy = answered ? Math.round((app.stats.correct / answered) * 100) : 0;

  elements.totalCount.textContent = total;
  elements.answeredCount.textContent = answered;
  elements.accuracy.textContent = `${accuracy}%`;
  elements.wrongCount.textContent = app.stats.wrongIds.length;
  elements.statusLine.textContent = `${total} 题 · 当前 ${app.mode === "wrong" ? "错题" : "全题"}模式`;
}

function setMode(mode) {
  app.mode = mode;
  elements.modeButtons.forEach((button) => {
    const active = button.dataset.mode === mode;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-selected", String(active));
  });
  resetDeck();
  nextQuestion();
  updateStats();
}

function resetAllProgress() {
  const confirmed = window.confirm("重置所有练习记录？之前做过的题、正确率和错题都会清空。");
  if (!confirmed) return;

  app.stats = createEmptyStats();
  app.selectedKey = "";
  app.current = null;
  removeStoredValue();
  setMode("all");
}

async function init() {
  loadStoredStats();

  try {
    app.questions = await loadQuestions();
    resetDeck();
    nextQuestion();
    updateStats();
  } catch (error) {
    elements.statusLine.textContent = "题库读取失败";
    elements.questionId.textContent = "-";
    elements.pageInfo.textContent = "-";
    elements.questionText.textContent = "请通过本地服务器或已部署的网址打开应用。";
    setChildren(elements.options, []);
    console.error(error);
  }

  elements.nextButton.addEventListener("click", nextQuestion);
  elements.reshuffleButton.addEventListener("click", () => {
    resetDeck();
    nextQuestion();
  });
  elements.resetButton.addEventListener("click", resetAllProgress);
  elements.modeButtons.forEach((button) => {
    button.addEventListener("click", () => setMode(button.dataset.mode));
  });
}

init();
    </script>
  </body>
</html>
